<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>千星模拟器 · 浏览器试玩</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  /* header / 报错条 / 舞台 / footer —— 报错条是 `auto`：不报错时高度 0，报错时把舞台挤下去（永远看得见） */
  body{background:#0c1422;color:#edf3ff;font:13px/1.5 "Microsoft YaHei UI","Microsoft YaHei",Inter,sans-serif;
       display:grid;grid-template-rows:48px auto minmax(0,1fr) 30px}
  button{font:inherit;color:inherit;cursor:pointer;background:#16233a;border:1px solid #263750;border-radius:6px;padding:5px 11px}
  button:hover:not(:disabled){border-color:#3d5b86}
  button:disabled{opacity:.4;cursor:default}
  button.primary{background:#1d4ed8;border-color:#2f6bff}
  button.active{background:#1d4ed8;border-color:#2f6bff}
  select{font:inherit;color:inherit;background:#0d1726;border:1px solid #263750;border-radius:6px;padding:4px 6px}
  .bar{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #263750;background:#101a2a;flex-wrap:wrap}
  .bar .sp{flex:1}
  .tag{padding:2px 8px;border-radius:999px;background:#152238;border:1px solid #263750;color:#9fb0c8}
  .tag.on{background:#0f2f1c;border-color:#1f7a45;color:#5ee08a}
  .tag.err{background:#3a1418;border-color:#8b2635;color:#ff8a9b}
  /*
   * ★ `main` 必须**显式把行拉满**：`grid-template-rows:minmax(0,1fr)`。
   *
   * ⚠️ 这里踩过一个特别隐蔽的坑（作者两次实测：「右侧这么大的画面也太小了吧」「直接打开是这样」）：
   * `main` 只写了 `grid-template-columns`，**行是 auto** ⇒ 行高 = 内容高 = **画布的高度**，
   * 而画布高度又是 `fit()` 从舞台盒子里量出来算的 ⇒ **自己量自己**的死循环：
   * 某次把画布算小之后（比如刚插进 iframe 那一刻），行高跟着变小、下一轮量到的更小 ——
   * 最后锁死在 `可放 542×90` 这种一条缝上（footer 那行数字就是证据）。
   * 列不受影响（列宽由容器分配），所以症状是"**宽度一直正常、高度一直不对**"。
   */
  main{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 0;grid-template-rows:minmax(0,1fr);min-height:0}
  main.paneled{grid-template-columns:minmax(0,1fr) 340px}
  #stageWrap{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;background:#0a111d;height:100%;overflow:hidden;}
  /*
   * ★ 画布尺寸**由 CSS 固定成 16:9**：`#stage` 用 `aspect-ratio`，画布铺满它。
   * 这样"16:9"是**声明**出来的，不靠 JS 算高度 —— JS 只负责挑宽度，任何布局抖动都不会算出怪比例。
   */
  #stage{position:relative;outline:none;touch-action:none;aspect-ratio:1600/900;max-width:100%;max-height:100%;}
  #cv{display:block;width:100%;height:100%;background:#101a2a;border-radius:4px;box-shadow:0 6px 30px #0007}
  #side{display:none;border-left:1px solid #263750;background:#101a2a;min-width:0;overflow:auto;padding:10px 12px}
  main.paneled #side{display:block}
  #side h4{margin:2px 0 8px;font-size:12px;color:#9fb0c8;font-weight:600}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .log{font:11px/1.45 Consolas,monospace;white-space:pre-wrap;word-break:break-all;color:#c8d6ea}
  .log div{border-bottom:1px solid #17223a;padding:2px 0}
  .kv{display:flex;justify-content:space-between;gap:8px;font-size:12px;border-bottom:1px solid #17223a;padding:3px 0}
  .hint{color:#8f9caf;font-size:11px;line-height:1.5;background:#0d1726;border:1px solid #1d2b44;border-radius:6px;padding:7px 9px;margin-top:10px}
  code{background:#0d1726;border:1px solid #1d2b44;border-radius:4px;padding:0 4px;font-size:11px}
  footer{display:flex;align-items:center;gap:12px;padding:0 12px;border-top:1px solid #263750;background:#101a2a;color:#9fb0c8;font-size:12px;overflow:hidden;white-space:nowrap}
  #cvSize{color:#8ad1a0}
  #diag{color:#9fb0c8;opacity:.9}
  #stamp{color:#6b7b91;font-size:11px}
  /*
   * ⚠️ 报错条必须在**看得见的地方**：`#fatal` 以前放在 `#side` 里，而 `#side` 默认 `display:none`
   * （要点「侧栏」才出现）—— 于是「WebGL 起不来 / 会话没跑起来」这类错误**一个字都看不到**，
   * 用户看到的就是"一片黑"（2026-09-24 被 iframe 嵌进面板时暴露）。
   * 现在它是一条常驻在 header 下面的红条，出错就显形。
   */
  #fatal{display:none;white-space:pre-wrap;color:#ffd0d8;background:#3a1418;border-bottom:1px solid #8b2635;
         padding:8px 14px;font:12px/1.5 Consolas,monospace}
  #fatal.show{display:block}
  /*
   * 窄容器（面板里那 2/3 列 ≈ 570px、甚至更窄）：这一页在面板里是**嵌在 iframe 里**的，
   * 按全屏那套排版会把工具栏折成两三行、把舞台挤没 —— 所以窄了就整体收一档：
   * 长标题换成短标题、按钮与间距收紧，工具栏努力保持一行。
   */
  .title-mini{display:none}
  @media (max-width:820px){
    body{grid-template-rows:40px auto minmax(0,1fr) 26px;font-size:12px}
    .bar{gap:6px;padding:0 8px}
    .bar strong{display:none}
    .bar .title-mini{display:inline}
    button{padding:4px 7px;font-size:12px}
    select{padding:3px 4px;font-size:12px}
    footer{gap:8px;padding:0 8px;font-size:11px}
    #side{padding:8px}
  }
</style>
</head>
<body>
  <header class="bar">
    <strong>千星模拟器 · 浏览器试玩</strong>
    <strong class="title-mini">试玩</strong>
    <span class="tag" id="state">● 未开始</span>
    <button id="start" class="primary">开始试玩</button>
    <button id="pause" disabled>暂停</button>
    <button id="step" disabled>单步</button>
    <button id="reset" disabled>重开一局</button>
    <button id="stop" disabled>结束</button>
    <span class="sp"></span>
    <span class="tag" id="fixedCfg" title="画布/人数固定：面板与页面上的切换已按作者要求去掉（AI 仍可用 miliastra_sim op=play device/view 改）">PC 16:9 · 1 人 · P1</span>
    <button id="panelBtn">侧栏</button>
  </header>
  <div id="fatal"></div>

  <main id="main">
    <div id="stageWrap"><div id="stage" tabindex="0"><canvas id="cv" width="1600" height="900"></canvas></div></div>
    <aside id="side">
      <h4>运行</h4>
      <div id="stat"></div>
      <h4>服务端变量</h4>
      <div id="vars" class="log"></div>
      <h4>日志（脚本 print）</h4>
      <div id="logs" class="log"></div>
      <h4>这一局的操作时间线</h4>
      <div id="hist" class="log"></div>
      <div class="hint" id="histHint"></div>
    </aside>
  </main>

  <footer>
    <span id="frame">Frame 0</span><span id="time">0.00s</span>
    <span id="cvSize">画布 —</span>
    <span class="sp" style="flex:1"></span>
    <span id="diag" title="窗口 / main / 舞台 三个高度：哪一个明显小，问题就在那一层">—</span>
    <span id="stamp" title="试玩页版本戳（大小-mtime）；跟磁盘上的 play.html 对不上就是面板里那份是旧的，点「重载页面」">v__PLAY_STAMP__</span>
  </footer>

<script type="module">
  import { PixiPlayRenderer, createPlaySession } from '/miliastra/play-renderer.js'

  const API = '/miliastra/engine'
  const $ = (id) => document.getElementById(id)
  const el = { main: $('main'), stage: $('stage'), stageWrap: $('stageWrap'), cv: $('cv'), side: $('side') }
  /** 画布 id → 人话标签（只用于只读展示；引擎的权威清单在 `state.canvas.presets`）。 */
  const CANVAS_LABELS = {
    'pc-16-9': 'PC 16:9', 'pc-21-9': 'PC 21:9',
    'mobile-16-9': '手机 16:9', 'mobile-19.5-9': '手机 19.5:9', 'mobile-4-3': '手机 4:3',
  }
  let lastTimeline = 0

  function showError(error) {
    const box = $('fatal')
    box.classList.add('show')
    box.textContent = '⚠ ' + (error?.message || String(error))
    $('state').className = 'tag err'
    $('state').textContent = '● 出错'
  }

  /**
   * 页面 → Host：POST /miliastra/engine（与面板、与「模拟器」工具同一个 simOp 入口，
   * 所以浏览器里玩的和 AI/面板操作的是**同一份工程状态、同一个会话**）。
   * ⚠️ 画面要 `summaryOnly:false`：`scene` 是节点级增量场景，默认的"瘦身"会把它砍掉（只留计数）。
   */
  async function api(action, args = {}) {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ op: 'play', action, args: { view: true, ...args }, summaryOnly: false }),
    })
    const env = await res.json().catch(() => null)
    if (!res.ok || !env || env.ok === false) throw new Error((env && env.error) || '试玩请求失败')
    return env.data
  }

  /*
   * WebGL 起不来（iframe 里被策略挡、显卡驱动、无头环境）必须**当场说清楚** ——
   * 否则用户看到的就是一块黑，完全不知道是"引擎没跑"还是"浏览器不给 WebGL"。
   */
  let renderer
  try {
    renderer = new PixiPlayRenderer(el.cv)
  } catch (error) {
    showError(new Error('这个页面拿不到 WebGL，画不出来：' + (error?.message || error)
      + ' —— 请用面板里的「新窗口 ↗」单独打开本页试试（有些宿主页面会限制 iframe 的图形能力）'))
    throw error
  }

  /**
   * 把画布缩放到舞台里。**16:9 由 CSS 保证**（`#stage{aspect-ratio:1600/900}`），
   * 这里只挑一个宽度：`min(可用宽, 可用高×16/9)` —— 算错也只会得到"偏大/偏小"，不会算歪比例。
   *
   * ⚠️ **这里踩过一个坑**（作者实测：「右侧这么大的画面也太小了吧」）：
   * 页面刚被插进面板 iframe 时，舞台盒子**可能还没定下最终尺寸**（量到 ~330×180），
   * 而 `fit()` 一旦把画布写成小尺寸就**再也没重算** —— 于是 1600×900 的场景被缩成一个小方块。
   *
   * 现在的规则：① 盒子"明显太小"（<200×150）就**先不写**、下一帧再量（最多 300 帧）；
   * ② 由 `onSnapshot` 驱动**节流重算**（≥350ms 一次）—— 布局怎么变，最多 0.35 秒追平；
   * ③ 把量到的数字写进 footer（`画布 668×376（可放 875×400）`）—— **肉眼可核**，不用猜。
   */
  let fitTries = 0
  let lastFitAt = 0
  function fit(force) {
    const snap = play.snapshot
    if (!snap?.canvasWidth) return
    const pad = 20
    const box = el.stageWrap.getBoundingClientRect()
    const tooSmall = box.width < 200 || box.height < 150
    if (tooSmall && force !== true && fitTries < 300) {
      fitTries += 1
      requestAnimationFrame(() => fit())
      return
    }
    fitTries = 0
    const ratio = snap.canvasWidth / snap.canvasHeight          // 1600/900
    const w = Math.max(160, Math.floor(Math.min(box.width - pad, (box.height - pad) * ratio)))
    el.stage.style.width = w + 'px'                              // 高由 aspect-ratio 决定
    const info = $('cvSize')
    if (info) {
      info.textContent = '画布 ' + w + '×' + Math.round(w / ratio) + '（16:9 固定）'
    }
    /*
     * ★ 三个高度摆在一起（作者要求"把下面这块删了试试"之后的教训）：
     * 光看"画布很小"分不清是哪一层被压 —— 窗口（= iframe 高度）/ main（页面中间那行）/ 舞台。
     *   · 窗口小 → 是**面板**没给够高度；
     *   · 窗口正常但 main 小 → 页面自己的行没拉满；
     *   · main 正常但舞台小 → 舞台没填满 main。
     */
    const diag = $('diag')
    if (diag) {
      diag.textContent = '窗 ' + window.innerHeight + ' / main ' + (el.main ? el.main.clientHeight : 0)
        + ' / 台 ' + Math.round(box.width) + '×' + Math.round(box.height)
    }
  }
  /** 节流重算：由每一帧快照驱动 —— 不管布局怎么变，0.35 秒内追平。 */
  function fitSoon() {
    const now = (typeof performance !== 'undefined' ? performance.now() : Date.now())
    if (now - lastFitAt < 350) return
    lastFitAt = now
    fit()
  }
  if (typeof ResizeObserver === 'function') new ResizeObserver(() => fit()).observe(el.stageWrap)
  addEventListener('load', () => requestAnimationFrame(() => fit()))
  addEventListener('resize', () => fit())

  function renderChrome(snap) {
    $('frame').textContent = 'Frame ' + (snap.frame ?? 0)
    $('time').textContent = Number(snap.time || 0).toFixed(2) + 's'
    const paused = !!snap.paused
    $('state').className = 'tag' + (play.running ? (paused ? '' : ' on') : '')
    $('state').textContent = play.running ? (paused ? '● 已暂停' : '● 运行中') : '● 已结束'
    $('pause').textContent = paused ? '继续' : '暂停'
    for (const id of ['pause', 'step', 'reset', 'stop']) $(id).disabled = !play.running
    $('start').disabled = !!play.running
    const stat = [
      ['画布', snap.canvasId || '-'],
      ['人数', snap.playerCount ?? 1],
      ['视角', snap.viewPlayerIndex ?? 1],
      ['帧', snap.frame ?? 0],
      ['时间', Number(snap.time || 0).toFixed(2) + 's'],
      ['场景版本', snap.scene?.revision ?? '-'],
    ]
    $('stat').replaceChildren(...stat.map(([k, v]) => {
      const row = document.createElement('div'); row.className = 'kv'
      const a = document.createElement('span'); a.textContent = k
      const b = document.createElement('b'); b.textContent = String(v)
      row.append(a, b); return row
    }))
    const vars = Array.isArray(snap.serverVars) ? snap.serverVars : []
    $('vars').replaceChildren(...(vars.length ? vars.map((v) => {
      const d = document.createElement('div')
      d.textContent = (v.entityType || '') + '.' + (v.name || '') + ' = ' + JSON.stringify(v.value)
      return d
    }) : [Object.assign(document.createElement('div'), { textContent: '(还没有变量)' })]))
    const logs = Array.isArray(snap.logs) ? snap.logs.slice(-40) : []
    $('logs').replaceChildren(...(logs.length ? logs.map((l) => {
      const d = document.createElement('div'); d.textContent = l.text || ''; return d
    }) : [Object.assign(document.createElement('div'), { textContent: '(还没有日志)' })]))
    $('pause').disabled = !play.running
    // 固话提示条跟着真实状态走（画布/人数/视角仍然**只读**显示 —— 看得到，但没有能打歪画布尺寸的开关）
    const cfg = $('fixedCfg')
    if (cfg) {
      const label = (CANVAS_LABELS[snap.canvasId] || snap.canvasId || 'PC 16:9')
      cfg.textContent = label + ' · ' + (snap.playerCount || 1) + ' 人 · P' + (snap.viewPlayerIndex || 1)
    }
  }

  async function refreshTimeline(force) {
    const now = Date.now()
    if (!force && now - lastTimeline < 1500) return
    lastTimeline = now
    try {
      const h = await api('history')
      const rows = (h && h.events) || []
      $('hist').replaceChildren(...(rows.length ? rows.slice(-60).map((e) => {
        const d = document.createElement('div')
        const p = e.payload || {}
        d.textContent = Number(e.t || 0).toFixed(2) + 's  ' + e.kind
          + (p.typeName ? ' ' + p.typeName : '') + (p.type ? ' ' + p.type : '')
          + (p.name ? ' ' + p.name : '')
          + (p.x !== undefined ? ' (' + Math.round(p.x) + ',' + Math.round(p.y) + ')' : '')
        return d
      }) : [Object.assign(document.createElement('div'), { textContent: '(还没有操作)' })]))
      $('histHint').innerHTML = '这一局的操作时间线可以直接交给 AI 做回归：'
        + '<br><code>miliastra_sim {"op":"verify","fromHistory":true,"expect":[{"kind":"var","entityType":"PlayerSelf","name":"Gold","equals":3}]}</code>'
        + '<br>（AI 不用手抄上面这 ' + rows.length + ' 步；注意回放会重开会话，这一局就结束了）'
        + '<br>关掉这个页面**不会**停掉这一局 —— 好让 AI 还能取到它；不想让它跑就点「结束」。'
    } catch (error) { /* 时间线是辅助信息，取不到不打断试玩 */ }
  }

  const play = createPlaySession({
    renderer,
    api,
    onSnapshot: (snap) => { fitSoon(); renderChrome(snap); void refreshTimeline(false) },
    onStatus: (s) => { $('frame').textContent = 'Frame ' + (s.frame ?? 0); $('time').textContent = Number(s.time || 0).toFixed(2) + 's' },
    onError: showError,
  })
  play.bindInput(el.stage, { keysOn: window })

  /*
   * ★ **画布/人数/视角固定**（作者要求：「固定这样，把切换的功能去掉」）。
   *
   * 为什么值得固定：① 切设备会**重建整个运行时**（引擎的 `device` 就是重开一局），
   * 而画布一变，16:9 的舞台尺寸、AI 侧记下的操作坐标全都要重算；
   * ② 这里的设备清单原来是**手写的**，里面 `pc-4-3` / `phone-16-9` / `phone-4-3` 三个在引擎里**并不存在**
   *    （引擎只有 pc-16-9 / pc-21-9 / mobile-16-9 / mobile-19.5-9 / mobile-4-3）——
   *    选中就报 `unknown canvas preset: pc-4-3`（作者截图里那条红条）。
   *
   * 所以这里把三个下拉**整块去掉**，固定成 PC 16:9 / 1 人 / P1（也就是引擎的默认值）。
   * ⚠️ 能力没丢：AI 仍可用 `miliastra_sim {"op":"play","action":"device","args":{"canvasId":"mobile-16-9"}}`
   * 或 `action=view` / `playerCount` 去改 —— 只是人在这页上不再有会打歪画布尺寸的开关。
   */
  const FIXED_PLAY = { canvasId: 'pc-16-9', playerCount: 1, viewPlayerIndex: 1 }

  $('start').addEventListener('click', () => play.start(FIXED_PLAY)
    .then(() => { fit(); void refreshTimeline(true) }).catch(showError))
  $('pause').addEventListener('click', () => void play.act(play.snapshot?.paused ? 'resume' : 'pause').then(() => void api('get', { light: true })))
  $('step').addEventListener('click', () => void play.act('step', { dt: 1 / 30 }))
  $('reset').addEventListener('click', () => play.start(FIXED_PLAY).then(() => fit()).catch(showError))
  $('stop').addEventListener('click', () => play.stop().then(() => refreshTimeline(true)).catch(showError))
  $('panelBtn').addEventListener('click', (e) => {
    el.main.classList.toggle('paneled')
    e.target.classList.toggle('active')
    fit()
  })
  addEventListener('resize', fit)
  /*
   * ⚠️ 关页面**故意不 stop**：
   *   `fromHistory` 要靠这一个活着的会话把「人刚玩的这一局」变成回归用例 —— 一关页就 stop 的话，
   *   history 直接归零，那条路就断了。想让它停就点上面的「结束」，或让插件卸载（`disposeSimAll` 会收干净）。
   */
  addEventListener('pagehide', () => { play.destroy() })

  // 打开先**接上已有会话**（可能 AI / 面板正跑着同一份工程），接不上才新开一局 —— 别一进来就把人家的局顶掉
  play.attach()
    .then(() => { fit(); void refreshTimeline(true) })
    .catch(() => play.start(FIXED_PLAY).then(() => { fit(); void refreshTimeline(true) }))
    .catch(showError)
</script>
</body>
</html>
